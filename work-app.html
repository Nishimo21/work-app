  kenpin.forEach(r=>{const k=r.product.trim();if(!map[k])map[k]={ins:new Set(),count:0,sec:0,last:r.start};
    r.workers.forEach(w=>map[k].ins.add(w));map[k].count+=(r.count||0);map[k].sec+=effSec(r);
    if(new Date(r.start)>new Date(map[k].last))map[k].last=r.start;});

  if(sup.length){const rows=sup.map(s=>{const m=map[s.code]||map[s.name],done=!!m;

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

        <input type="file" id="shiireFile" class="file-in" accept=".csv,text/csv"></div></div>

    out.style.display='block';out.innerHTML='診断中…';

    const ping=url+(url.includes('?')?'&':'?')+'mode=ping';
    try{
      const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch(ping,{signal:ctl.signal});clearTimeout(t);
      if(r.ok){let j=null;try{j=await r.json();}catch(e){}
        lines.push('① fetch方式: ✅ 成功 (HTTP '+r.status+(j&&j.ok?' / '+(j.sheet||''):' / 応答解析不可')+')');}
      else lines.push('① fetch方式: ⚠ HTTP '+r.status);
    }catch(e){lines.push('① fetch方式: ❌ '+(e.name==='AbortError'?'タイムアウト':(e.message||'失敗')));}
    await new Promise(res=>{
      const cb='__diag'+Math.floor(Math.random()*1e9);const s=document.createElement('script');
      const to=setTimeout(()=>{delete window[cb];s.remove();lines.push('② script方式: ❌ タイムアウト');res();},15000);
      window[cb]=d=>{clearTimeout(to);delete window[cb];s.remove();lines.push('② script方式: ✅ 成功'+(d&&d.ok?' ('+(d.sheet||'')+')':''));res();};
      s.onerror=()=>{clearTimeout(to);delete window[cb];s.remove();lines.push('② script方式: ❌ 読込エラー');res();};
      s.src=ping+'&callback='+cb;document.body.appendChild(s);
    });
    // ③ 変更点取得(本番と同じ処理)のテスト
    try{
      const d=await gasGet(url+(url.includes('?')?'&':'?')+'mode=changes&since='+todayStr());
      if(d&&d.ok===false)lines.push('③ 変更点取得: ❌ サーバー側エラー: '+(d.error||'不明'));
      else lines.push('③ 変更点取得: ✅ 成功 (今日の記録 '+((d&&d.changes)||[]).length+'件)');
    }catch(e){lines.push('③ 変更点取得: ❌ '+(e.message||'失敗'));}
    // ④ 納品ボードのテスト(サーバーの版・色判定まで確認)
    try{
      const d=await gasGet(url+(url.includes('?')?'&':'?')+'mode=board&debug=1');
      if(d&&d.ok===false)lines.push('④ 納品ボード: ❌ サーバー側エラー: '+(d.error||'不明'));
      else if(!d||d.groups===undefined)lines.push('④ 納品ボード: ❌ サーバーが旧バージョンです → GASコードを貼り替えて「デプロイを管理→✏→新バージョン→デプロイ」を実行してください');
      else{
        lines.push('④ 納品ボード: ✅ 対象セット '+d.groups.length+'件'+(d.groups.length?' ['+d.groups.map(g=>g.set+'('+g.items.length+'個)').join(' ')+']':''));
        if(d.dbg)lines.push('　管理番号がある行の色内訳: '+Object.entries(d.dbg).map(([k,v])=>k+'='+v+'件').join(' / ')+'（対象=黄・緑・柿）');
      }
    }catch(e){lines.push('④ 納品ボード: ❌ '+(e.message||'失敗'));}
    lines.push('この結果を送ってもらえれば原因を特定できます');
    out.innerHTML=lines.map(esc).join('<br>');
  });
  document.querySelectorAll('[data-chg-refresh]').forEach(b=>b.onclick=()=>fetchChanges(false,true));
  if(scfg.url&&(route.page==='worker'||route.page==='shiire'||route.page==='admin')&&!shiireData.fetchedAt&&!shiireData.loading)fetchChanges(true);
  if(scfg.url&&route.page==='home'&&!boardData.fetchedAt)fetchBoard();
  bindTooltips();startElapsedLoop();
}

/* ---------- CSV ---------- */
function csvE(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,content){const blob=new Blob(["﻿"+content],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const recs=filteredRecords();
  const head=['日付','作業','作業者','開始','終了','作業時間(分)','個数','商品コード','梱包No','種別','撮り直し','再チェック','備考'];
  const rows=recs.map(r=>{const t=ALL_TASKS[r.cat];return [isoDay(r.start),t.label,r.workers.join('・'),fmtHM(r.start),t.timed?fmtHM(r.end):'',
    t.timed?Math.round(r.sec/60):'',r.count??'',r.product||'',r.packNo||'',r.sub||'',r.retake?'○':'',r.recheck?'○':'',r.note||''].map(csvE).join(',');});
  download('作業タイム記録_'+todayStr()+'.csv',[head.join(','),...rows].join('\n'));toast('CSVを出力しました');}
function exportKenpin(){const recs=state.records.filter(r=>r.cat==='kenpin');
  const head=['日付','商品コード/名','検品者','個数','作業時間(分)','備考'];
  const rows=recs.map(r=>[isoDay(r.start),r.product||'',r.workers.join('・'),r.count??'',Math.round(r.sec/60),r.note||''].map(csvE).join(','));
  download('検品結果_'+todayStr()+'.csv',[head.join(','),...rows].join('\n'));toast('検品結果を出力しました');}
function parseCSV(text){const rows=[];let row=[],cur='',q=false;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()!==''));}

  rd.onload=()=>{const rows=parseCSV(rd.result);if(!rows.length){toast('データがありません');return;}

/* GAS呼び出し: fetch(標準・CORS)を優先し、失敗したらJSONP(scriptタグ)に自動フォールバック */
async function gasGet(url){
  let fetchErr='';
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),30000);
    const res=await fetch(url,{signal:ctl.signal,redirect:'follow'});
    clearTimeout(t);
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }catch(e){fetchErr=e.name==='AbortError'?'timeout':(e.message||'fetch failed');}
  return new Promise((resolve,reject)=>{
    const cb='__gcb'+Math.floor(Math.random()*1e9);
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject(new Error('タイムアウト/'+fetchErr));},30000);
    function cleanup(){delete window[cb];clearTimeout(to);s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('読込ブロック/'+fetchErr));};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
function fetchChanges(silent,force){

/* ============================================================
   記録のデータ同期 (全PCで共有)
   保存/編集/削除のたびにサーバー(Apps Script)へ送信し、
   1分毎+起動時に取得してマージする。オフライン時はキューに保持
   ============================================================ */
const SYNCQ_KEY='worktimer_syncq';
let syncQ=(()=>{try{return JSON.parse(localStorage.getItem(SYNCQ_KEY))||[];}catch(e){return [];}})();
let flushing=false, lastSyncAt=null;
function saveQ(){try{localStorage.setItem(SYNCQ_KEY,JSON.stringify(syncQ));}catch(e){}}
function queuePush(rec){
  if(!rec||!rec.id)return;
  const copy=JSON.parse(JSON.stringify(rec));
  syncQ=syncQ.filter(q=>q.id!==copy.id||q.deleted!==copy.deleted);
  syncQ.push(copy);saveQ();flushQ();
}
async function flushQ(){
  if(!scfg.url||flushing||!syncQ.length)return;
  flushing=true;
  try{
    while(syncQ.length){
      const rec=syncQ[0];
      const d=await gasGet(scfg.url+(scfg.url.includes('?')?'&':'?')+'mode=push&rec='+encodeURIComponent(JSON.stringify(rec)));
      if(!d||d.ok===false)break;
      syncQ.shift();saveQ();lastSyncAt=new Date();
    }
  }catch(e){}
  flushing=false;
}
async function pullRecords(){
  if(!scfg.url)return;
  try{
    const d=await gasGet(scfg.url+(scfg.url.includes('?')?'&':'?')+'mode=pull');
    if(!d||!d.records)return;
    const byId={};state.records.forEach(r=>byId[r.id]=r);
    let changed=false;
    const serverIds=new Set();
    d.records.forEach(sr=>{
      serverIds.add(sr.id);
      const loc=byId[sr.id];
      if(sr.deleted){ if(loc){state.records=state.records.filter(x=>x.id!==sr.id);changed=true;} return; }
      if(!loc){ state.records.push(sr); changed=true; }
      else if((sr.updatedAt||0)>(loc.updatedAt||0)){ Object.assign(loc,sr); changed=true; }
    });
    // サーバーに無いローカル記録(過去分・オフライン作成分)をアップロード
    const queued=new Set(syncQ.map(q=>q.id));
    state.records.forEach(r=>{ if(!serverIds.has(r.id)&&!queued.has(r.id)&&!r.sample){ r.updatedAt=r.updatedAt||Date.now(); queuePush(r); } });
    if(changed){ saveState(); render(); }
    lastSyncAt=new Date();
  }catch(e){}
}

}

function stepInfo(items,ss){
  const total=items.length;
  if(!ss)return {cnt:0,done:false,label:'未'};
  const isOn=i=>ss.all||(ss.checked&&ss.checked[i]);
  const cnt=items.filter(isOn).length;
  if(total>0&&cnt>=total)return {cnt,done:true,label:'✅ 完了'};
  if(!cnt)return {cnt:0,done:false,label:'未'};
  let lastContig=null;for(const i of items){if(isOn(i))lastContig=i;else break;}

function boardWindowStat(step,sISO,eISO){
  const s=new Date(sISO).getTime(),e=new Date(eISO).getTime()+60000;
  const last={};
  boardEvents.forEach(x=>{if(x.step!==step||x.t<s||x.t>e||!x.i)return;last[x.i]=x.n;});
  let plus=0,minus=0;
  Object.values(last).forEach(v=>{if(v>0)plus++;else if(v<0)minus++;});
  return {plus,minus};
}

function bdAll(set,step){

function bdClear(set,step){ // 全て解除(誤って全て完了を押した時の取り消し)
  const g=boardData.groups.find(x=>x.set===set);if(!g)return;
  const ss=stepState(set,step);
  const had=g.items.filter(i=>ss.all||(ss.checked&&ss.checked[i]));
  ss.all=false;ss.checked={};
  had.forEach(i=>recordBoardDelta(step,-1,i));
  afterBoardChange(set);
}
function bdShuka(set){const ss=stepState(set,'shuka');ss.all=!ss.all;afterBoardChange(set);}
function bdSelf(set){const st=setState(set);st.selfDel=!st.selfDel;afterBoardChange(set);}
function bdHide(set){if(confirm('セット'+set+' を一覧から非表示にしますか？(進捗データは残ります)')){setState(set).hidden=true;afterBoardChange(set);}}
/* セットの完了判定(全SKU基準。チェックが外れれば未完了に戻る) */
function setDoneCalc(g,st){
  return setSteps(st).every(s=>{
    if(s.k==='shuka')return !!(st.steps&&st.steps.shuka&&st.steps.shuka.all);
    const items=STEP_PREV[s.k]?g.items:stepItems(g,s.k);
    return stepInfo(items,st.steps&&st.steps[s.k]).done;
  });
}
/* 集荷待ちの管理: 梱包完了かつ集荷未のセットに待ち始め時刻を記録(翌日持ち越し警告用) */
function shukaWaitSync(g,st){
  if(st.selfDel){if(st.shukaWait)delete st.shukaWait;return;}
  const konpoDone=stepInfo(g.items,st.steps&&st.steps.konpo).done;
  const shukaDone=!!(st.steps&&st.steps.shuka&&st.steps.shuka.all);
  if(konpoDone&&!shukaDone){if(!st.shukaWait)st.shukaWait=Date.now();}
  else if(st.shukaWait)delete st.shukaWait;
}
function afterBoardChange(set){
  const st=setState(set),g=boardData.groups.find(x=>x.set===set);
  if(g){
    const done=setDoneCalc(g,st);
    if(done&&!st.done){st.done=true;confetti();toast('📦 セット'+set+' の納品が完了しました！おつかれさまです 🎉');}
    else if(!done&&st.done){st.done=false;} // 全て解除などで未完了に戻す
    shukaWaitSync(g,st);
  }
  renderBoardPanels();pushSetState(set);
}
/* ============================================================
   警告センター: 全ての警告をヘッダー右上の「⚠警告」に集約
   ・問題が修正されると自動で消える ・「✓解除」で手動でも消せる(全PC共通)
   ・履歴は管理者ページに一覧(_warnLogで共有・30日/100件で自動整理)
   ============================================================ */
function collectWarns(){
  const ws=[],td=todayStr();
  (boardData.groups||[]).forEach(g=>{
    const st=boardData.states[g.set];if(!st||st.hidden)return;
    const stt=st.steps||{};
    if(!st.selfDel&&!st.done){
      const konpoDone=stepInfo(g.items,stt.konpo).done;
      const shukaDone=!!(stt.shuka&&stt.shuka.all);
      if(konpoDone&&!shukaDone){
        // 当日の集荷依頼待ちは警告ではなくヘッダー(タイトル右)に常時表示(collectShukaWait)
        if(st.shukaWait&&isoDay(new Date(st.shukaWait).toISOString())!==td)
          ws.push({key:`carry|${g.set}|${td}`,lv:'crit',tx:`🚚 ${g.set}〜 は前日以前から集荷依頼待ちです。集荷されていないか段ボールを確認し、残っていれば集荷依頼をかけてください。すでに集荷済みなら「集荷依頼済みにする」の押し忘れの可能性があります`});
      }
    }
    [['satsuei','shashin','撮影','写真チェック'],['shashin','amazon','写真チェック','Amazon貼付'],['shashin','konpo','写真チェック','梱包']].forEach(([pa,pb,na,nb])=>{
      const A=stt[pa],B=stt[pb];if(!B)return;
      const bad=g.items.filter(i=>(B.all||(B.checked&&B.checked[i]))&&!(A&&(A.all||(A.checked&&A.checked[i]))));
      if(bad.length)ws.push({key:`rev|${g.set}|${pa}|${pb}|${td}`,lv:'crit',tx:`⚠ ${g.set}〜: ${na}が未のまま${nb}済みになっているSKUがあります(${bad.slice(0,5).join(', ')}${bad.length>5?' ほか':''}) — チェックミスの可能性`});
    });
  });
  const kpW=(boardData.states&&boardData.states['_koboreSKU']&&boardData.states['_koboreSKU'].items)||{};
  if(Object.keys(kpW).length)ws.push({key:`kobore|${td}`,lv:'warn',tx:`📦 納品待ちSKUが ${Object.keys(kpW).length}個 あります。次回の梱包＆納品/自己配梱包の終了画面で選択して消化してください`});
  (shiireData.changes||[]).filter(c=>c.type==='警告'&&isoDay(c.t)===td).forEach(c=>{
    ws.push({key:'sh|'+c.t+'|'+c.no,lv:'crit',tx:`🚨 ${c.editor}へ: No.${c.no}${c.sku?' / '+c.sku:''} — ${c.note}`});
  });
  return ws;
}
function warnLog(){const s=boardData.states['_warnLog']=boardData.states['_warnLog']||{items:{}};s.items=s.items||{};return s;}
function activeWarns(){ // 検出中の警告を履歴に記録しつつ、解除済みを除いて返す
  const ws=collectWarns(),lg=warnLog();let ch=false;
  ws.forEach(w=>{if(!lg.items[w.key]){lg.items[w.key]={tx:w.tx,lv:w.lv,t:Date.now(),done:0};ch=true;}});
  const lim=Date.now()-30*86400000;
  Object.keys(lg.items).forEach(k=>{if(lg.items[k].t<lim){delete lg.items[k];ch=true;}});
  const keys=Object.keys(lg.items);
  if(keys.length>100){keys.sort((a,b)=>lg.items[a].t-lg.items[b].t).slice(0,keys.length-100).forEach(k=>{delete lg.items[k];ch=true;});}
  if(ch&&scfg.url)pushSetState('_warnLog');
  return ws.filter(w=>!(lg.items[w.key]&&lg.items[w.key].done));
}
/* 集荷依頼待ちのセット一覧(タイトル右に常時表示・警告扱いではない) */
function collectShukaWait(){
  const out=[],td=todayStr();
  (boardData.groups||[]).slice().sort((a,b)=>a.set.localeCompare(b.set)).forEach(g=>{
    const st=boardData.states[g.set];if(!st||st.hidden||st.selfDel)return;
    const stt=st.steps||{};
    const konpoDone=stepInfo(g.items,stt.konpo).done;
    const shukaDone=!!(stt.shuka&&stt.shuka.all);
    if(konpoDone&&!shukaDone)out.push({set:g.set,carry:!!(st.shukaWait&&isoDay(new Date(st.shukaWait).toISOString())!==td)});
  });
  return out;
}
function renderWarnHead(){
  const b=document.getElementById('warnBtn');
  if(b){
    let n=0;try{n=activeWarns().length;}catch(e){}
    b.style.display=n?'':'none';
    b.textContent=`⚠ 警告 ${n}件`;
  }
  const sh=document.getElementById('shukaHead');
  if(sh){
    let w=[];try{w=collectShukaWait();}catch(e){}
    if(!w.length)sh.style.display='none';
    else{
      const anyCarry=w.some(x=>x.carry);
      sh.style.display='';
      sh.style.color=anyCarry?'var(--crit)':'var(--satsuei)';
      sh.textContent=`🚚 集荷依頼待ち: ${w.map(x=>x.set+'〜'+(x.carry?'(前日分)':'')).join('・')}（14時までに集荷依頼）`;
    }
  }
}
function warnDismiss(k){
  const lg=warnLog();
  lg.items[k]=lg.items[k]||{tx:'',lv:'warn',t:Date.now()};
  lg.items[k].done=1;lg.items[k].doneAt=Date.now();
  pushSetState('_warnLog');
}
function openWarns(){
  const act=activeWarns();
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3 style="color:var(--crit)">⚠ 現在の警告</h3>
    <div class="sub">問題が修正されると自動で消えます。対応済みの警告は「✓ 解除」で消せます（全PC共通）</div>
    ${act.length?act.map(w=>`<div style="display:flex;gap:10px;align-items:center;padding:9px 12px;margin-top:8px;border:1px solid ${w.lv==='crit'?'color-mix(in srgb,var(--crit) 45%,transparent)':'var(--border)'};border-radius:12px;background:${w.lv==='crit'?'color-mix(in srgb,var(--crit) 7%,var(--surface))':'var(--surface-2)'}">
      <span style="min-width:0;font-size:13.5px">${esc(w.tx)}</span>
      <button class="btn ghost sm" data-wd="${esc(w.key)}" style="margin-left:auto;flex:0 0 auto;color:var(--good);white-space:nowrap">✓ 解除</button></div>`).join('')

    <div class="modal-acts"><button class="btn primary" onclick="closeModal()">閉じる</button></div>`;
  showModal();
  box.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{warnDismiss(b.dataset.wd);openWarns();renderWarnHead();});
}

          <span style="font-weight:900">📦 ${esc(g.set)}〜</span><span class="tag">${g.items.length}個</span>
          ${st.selfDel?'<span class="tag" style="color:var(--good)">自己配送</span>':''}
          <span style="margin-left:auto;color:var(--muted);font-size:12.5px">▸ 展開</span></div>`;
      }).join(''):`<div class="thint" style="margin-top:6px">完了したセットはまだありません</div>`}
    </div>`;
  }
  if(!visible.length&&!resale.length&&!extraCard)return head+doneSection+`<div class="empty">進行中の納品セットはありません 🎉</div>`;
  if(!visible.length)return head+doneSection+`<div class="empty" style="padding:14px 0">進行中の納品セットはありません</div>`+extraCard+resaleCard;
  return head+doneSection+visible.map(setCard).join('')+extraCard+resaleCard;
}

const CHG_COLOR={'白':'#ffffff','白系':'#f2f2f2','黒':'#333333','灰':'#999999','赤':'#e23b3b','桃':'#f27bb0','柿':'#f58220','黄':'#f5c400','緑':'#3bb545','水':'#40c8e0','青':'#3a6df0','紫':'#8a63f6'};
const TYPE_STYLE={'変更':'var(--nouhin)','色変更':'var(--zatsumu)','要確認':'var(--satsuei)','警告':'var(--crit)','行追加':'var(--kenpin)','行削除':'var(--crit)'};

/* 検品の自動カウント: 計測時間内のB列色変更を集計
   ・灰→他色 = 検品1個。ただし同一No.は1日1個まで(その日最初に灰→色になった計測に計上)
   ・赤→(白・灰以外) = 再検品(別枠・平均に含めない)。こちらは同一No.でも毎回カウント */
function kenpinAutoCounts(startISO,endISO,worker){
  const s=new Date(startISO).getTime(), e=new Date(endISO).getTime()+180000; // 記録遅延ぶん終了後3分まで
  const firstGray={}; let re=0;
  (shiireData.changes||[]).forEach(c=>{
    if(c.col!=='B列色')return;
    const t=new Date(c.t).getTime();
    // タイマーを回している本人の変更のみ数える(実行者不明分は含める。複数人登録「A・B」は各人にマッチ)
    if(worker&&c.editor&&c.editor!=='不明'&&c.editor!=='未設定'&&String(c.editor).split('・').indexOf(worker)<0)return;
    if(c.oldV==='灰'){
      const no=(c.no||('row'+c.row))+'|'+isoDay(c.t); // 同一No.は「同じ日」の最初の1回だけ(データは7日分あるため日付込みで判定)
      if(!(no in firstGray)||t<firstGray[no]) firstGray[no]=t;
    }else if(c.oldV==='赤'&&c.newV!=='白'&&c.newV!=='灰'){
      if(String(c.note||'').indexOf('未検品')>=0){
        // P列に「未検品」がある赤→他色は通常の検品としてカウント(同一No.は1日1個)
        const no=(c.no||('row'+c.row))+'|'+isoDay(c.t);
        if(!(no in firstGray)||t<firstGray[no]) firstGray[no]=t;
      }else if(t>=s&&t<=e) re++; // それ以外の赤→他色は再検品として毎回カウント
    }
  });
  let cnt=0;
  Object.values(firstGray).forEach(t=>{ if(t>=s&&t<=e) cnt++; });
  return {cnt,re};
}

  if(!list.length) return head+fwBtns+errNote+`<div class="empty">直近7日の変更はありません${whiteN?`（白変更 ${whiteN}件は納品用に記録中）`:''}</div>`;

/* 1日分の変更カード(商品No.ごとに1カード) */
function chgDayCards(list,full,pfx){
  const groups={},order=[];
  list.forEach(c=>{const k=c.no||'?';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(c);});
  const shown=full?order:order.slice(0,8);
  // カード内は変更順ではなく列の並び(アルファベット順: B→J〜N→O/P→S…)で表示
  const COL_ORDER={'B列色':1,'行':2,'メーカー':10,'商品名':11,'売値':12,'仕入額':13,'状態':14,'外観':15,
    'ファインダー':16,'液晶':17,'光学':18,'プラス要素':19,'マイナス要素':20,'JAN':21,'ASIN':22,'管理番号(S)':23};
  const ord=c=>c.type==='警告'?0:(COL_ORDER[c.col]??50);
  const dot=h=>`<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${CHG_COLOR[h]||'#ccc'};border:1px solid var(--border);vertical-align:-1px"></span>`;
  const timeLink=(key,arr)=>{const last=arr[arr.length-1];
    return `<a data-tgl="${esc(key)}" style="color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline dotted;font-variant-numeric:tabular-nums;white-space:nowrap">${esc(last.editor)} ${fmtHM(last.t)}${arr.length>1?` (${arr.length}回)`:''}</a>`;};
  const detailBox=(key,arr,isColor,showCol)=>{
    if(!chgOpen.has(key))return '';
    return `<div style="margin:6px 0 3px 6px;padding:8px 11px;background:var(--surface);border:1px dashed var(--border);border-radius:11px;font-size:12.5px;color:var(--ink2)">`+
      arr.map(c=>`<div style="display:flex;gap:9px;align-items:baseline">
        <span style="font-variant-numeric:tabular-nums;flex:0 0 auto">${fmtHM(c.t)}</span>
        <span>${showCol?esc(c.col)+': ':''}${isColor? dot(c.oldV)+' '+esc(c.oldV)+' → '+dot(c.newV)+' '+esc(c.newV)
          : (c.oldV?`「${esc(c.oldV)}」→ `:'')+`「${esc(c.newV)}」`}</span>
        <span style="margin-left:auto;color:var(--muted);flex:0 0 auto">${esc(c.editor)}</span></div>`).join('')+`</div>`;
  };
  const chainOf=arr=>{ // 変更の連鎖(連続する同じ値はまとめる)
    let ch=[]; if(arr[0].oldV)ch.push(arr[0].oldV);
    arr.forEach(c=>ch.push(c.newV));
    return ch.filter((v,i)=>i===0||v!==ch[i-1]);
  };
  const row=(main,right,detail)=>`<div style="padding:5px 0;border-bottom:1px dashed var(--border);font-size:13.5px">
    <div style="display:flex;gap:8px;align-items:baseline">${main}<span style="margin-left:auto;flex:0 0 auto">${right}</span></div>${detail||''}</div>`;

  const body=shown.map(no=>{
    const items=groups[no];
    const sku=(items.find(c=>c.sku)||{}).sku||'';
    const lineArr=[];
    // 警告・行追加・行削除は単独行のまま
    items.filter(c=>c.type==='警告'||c.type==='行追加'||c.type==='行削除').forEach(c=>{
      const col=TYPE_STYLE[c.type]||'var(--muted)';
      const d=c.type==='警告'?esc(c.note):c.type==='行削除'?`No.${esc(c.no)} の行が削除されました`:esc(c.newV);
      lineArr.push({ord:ord(c),html:row(
        `<span class="pill" style="background:${col};flex:0 0 auto">${c.type}</span><span style="min-width:0">${d}</span>`,
        `<span style="color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap">${esc(c.editor)} ${fmtHM(c.t)}</span>`)});
    });
    // 同じ列の複数変更は1行に連結(例: 灰→黄→灰→黄)。時刻クリックで履歴詳細
    const colGroups={};
    items.filter(c=>c.type!=='警告'&&c.type!=='行追加'&&c.type!=='行削除').forEach(c=>{(colGroups[c.col]=colGroups[c.col]||[]).push(c);});
    Object.values(colGroups).forEach(arr=>arr.sort((a,b)=>new Date(a.t)-new Date(b.t)));

    // ◆ 状態(J列): 元の値からの「変更」があった時だけ、元の状態→変更後 を専用行で表示
    if(colGroups['状態']){
      const arr=colGroups['状態'].filter(c=>String(c.oldV).trim()!=='');
      if(arr.length){
        const chain=chainOf(arr);
        const key=pfx+no+'|状態';
        lineArr.push({ord:COL_ORDER['状態']??14,html:row(
          `<span class="pill" style="background:var(--satsuei);flex:0 0 auto">状態変更</span>
           <span style="min-width:0">状態: ${chain.map(v=>`「${esc(v)}」`).join(' → ')}</span>`,
          timeLink(key,arr),detailBox(key,arr,false))});
      }
      delete colGroups['状態'];
    }
    // ◆ コンディション(外観・ファインダー・液晶・光学)
    //   初期入力(空欄→値)は1行にまとめて表示 / 既存値の変更は状態と同じく「修正」行で 元→後 を表示
    const COND_COLS=['外観','ファインダー','液晶','光学'];
    const condParts=[],condAll=[];
    COND_COLS.forEach(cn=>{
      if(!colGroups[cn])return;
      const arr=colGroups[cn];
      const inits=arr.filter(c=>String(c.oldV).trim()==='');
      const edits=arr.filter(c=>String(c.oldV).trim()!=='');
      if(inits.length){
        const chain=chainOf(inits);
        condParts.push(chain.length>1
          ? `${esc(cn)}${chain.map(v=>`「${esc(v)}」`).join('→')}`
          : `${esc(cn)}「<b>${esc(chain[0]||'')}</b>」`);
        condAll.push(...inits);
      }
      if(edits.length){
        const chain=chainOf(edits);
        const key=pfx+no+'|'+cn+'_fix';
        lineArr.push({ord:(COL_ORDER['状態']??14)+0.1,html:row(
          `<span class="pill" style="background:var(--satsuei);flex:0 0 auto">修正</span>
           <span style="min-width:0">${esc(cn)}: ${chain.map(v=>`「${esc(v)}」`).join(' → ')}</span>`,
          timeLink(key,edits),detailBox(key,edits,false))});
      }
      delete colGroups[cn];
    });
    if(condParts.length){
      condAll.sort((a,b)=>new Date(a.t)-new Date(b.t));
      const key=pfx+no+'|コンディション';
      lineArr.push({ord:COL_ORDER['外観']??15,html:row(
        `<span class="pill" style="background:${TYPE_STYLE['変更']};flex:0 0 auto">変更</span>
         <span style="min-width:0">コンディション: ${condParts.join(' ・ ')}</span>`,
        timeLink(key,condAll),detailBox(key,condAll,false,true))});
    }
    // ◆ それ以外の列は従来どおり列ごとに1行
    Object.entries(colGroups).forEach(([colName,arr])=>{
      const isColor=colName==='B列色';
      const key=pfx+no+'|'+colName;
      const chain=isColor?[arr[0].oldV,...arr.map(c=>c.newV)].filter((v,i,a)=>i===0||v!==a[i-1]):chainOf(arr);
      const last=arr[arr.length-1];
      let main;
      if(isColor){
        main=`<span class="pill" style="background:${TYPE_STYLE['色変更']};flex:0 0 auto">色変更</span>
          <span style="min-width:0">${chain.map(h=>dot(h)+' '+esc(h)).join(' → ')}</span>`;
      }else{
        const pc=TYPE_STYLE[last.type]||'var(--nouhin)';
        const label=chain.length>1
          ? chain.map(v=>`「${esc(v)}」`).join(' → ')
          : `変更後「<b>${esc(chain[0]||'')}</b>」`;
        main=`<span class="pill" style="background:${pc};flex:0 0 auto">${last.type}</span>
          <span style="min-width:0">${esc(colName)}: ${label}</span>`;
      }
      lineArr.push({ord:COL_ORDER[colName]??50,html:row(main,timeLink(key,arr),detailBox(key,arr,isColor))});
    });
    lineArr.sort((a,b)=>a.ord-b.ord);
    return `<div style="margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:15px;padding:11px 14px">
      <div style="font-weight:900;font-size:14px">📦 No.${esc(no)}${sku?` <span style="color:var(--muted);font-weight:600;font-size:12px">SKU: ${esc(sku)}</span>`:''}</div>${lineArr.map(l=>l.html).join('')}</div>`;
  }).join('');
  const more=!full&&order.length>shown.length?`<div class="thint" style="margin-top:8px;text-align:center">ほか ${order.length-shown.length} 商品の変更あり — 「仕入表連携」タブで全件表示</div>`:'';
  return body+more;
}

/* ============================================================
   退社時刻の押し忘れ自動停止
   全員16時退社: 開始日の16:30を過ぎても計測中のタイマーは
   16:00終了として自動保存し、備考に押し忘れの旨を記載
   ============================================================ */
const AUTO_END_H=16, AUTO_END_M=0, GRACE_H=16, GRACE_M=30;
function autoStopCheck(){
  if(!state.active.length) return;
  const now=new Date(); let n=0;
  state.active.slice().forEach(a=>{
    const s=new Date(a.start);
    const endT=new Date(s); endT.setHours(AUTO_END_H,AUTO_END_M,0,0);
    let grace=new Date(s); grace.setHours(GRACE_H,GRACE_M,0,0);
    if(s>=endT) grace=new Date(s.getTime()+2*3600000); // 16時以降に開始した場合は開始2時間後を猶予に
    if(now<=grace) return;
    const end = s<endT ? endT : s; // 16時以降開始なら開始時刻で終了(0:00)
    const t=ALL_TASKS[a.cat];
    addRec({id:uid(),cat:a.cat,workers:a.workers.slice(),start:a.start,end:end.toISOString(),
      sec:durSec(a.start,end.toISOString()),
      count:t.fields.includes('count')?0:null,product:null,packNo:null,sub:null,
      retake:false,recheck:false,
      note:'⚠ 停止押し忘れのため16:00で自動終了・保存'});
    state.active=state.active.filter(x=>x.id!==a.id);
    n++;
  });
  if(n){saveState();render();toast(`⚠ 停止押し忘れ ${n}件を16:00で自動終了・保存しました（備考に記載済み）`);}
}
setInterval(autoStopCheck,30000);

/* ---------- theme / clock ---------- */
document.getElementById('manualBtn').onclick=openStaffManual;
document.getElementById('warnBtn').onclick=openWarns;
document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);
  document.getElementById('themeBtn').textContent=nx==='dark'?'☀️':'🌙';render();};
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(tick,1000);tick();

autoStopCheck(); // 起動時にも押し忘れをチェック(前日分など)
render();
if(scfg.url){flushQ();pullRecords();} // 起動時に記録を同期
</script>
</body>
</html>
