<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作業内容管理アプリ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap');
:root{
  color-scheme: light;
  --bg1:#f5f5ff; --bg2:#eef3ff;
  --surface:#ffffff; --surface-2:#f6f7fd;
  --ink:#191b26; --ink2:#585c6e; --muted:#989cae;
  --border:rgba(25,27,38,.08);
  /* 作業カラー */
  --kenpin:#10b07e; --satsuei:#f26a2f; --nouhin:#3a7bfd; --zatsumu:#8a63f6;
  --shashin:#0aa8cf; --amazon:#e8447f;
  /* 作業者カラー: 飯田=黄緑 / 久場=黄色 / 長尾=ピンク */
  --w-iida:#6cc23a; --w-kuba:#efb400; --w-nagao:#f0629f;
  --team:#3a7bfd;
  --good:#16b364; --crit:#ef4444;
  --grad-a:#6a5bff; --grad-b:#e8447f; --grad-c:#ffb020;
  --shadow-sm:0 1px 2px rgba(25,27,38,.06),0 2px 6px rgba(25,27,38,.04);
  --shadow:0 2px 8px rgba(70,60,180,.05),0 18px 44px -14px rgba(70,60,180,.18);
  --radius:24px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg1:#0e0f17; --bg2:#141627;
  --surface:#1a1c2b; --surface-2:#222437;
  --ink:#f3f4fa; --ink2:#b5b8c9; --muted:#7b7f92;
  --border:rgba(255,255,255,.09);
  --kenpin:#1ecb96; --satsuei:#ff7b42; --nouhin:#5c94ff; --zatsumu:#a488ff;
  --shashin:#25c1e5; --amazon:#ff6ba1;
  --w-iida:#84d551; --w-kuba:#ffcb2e; --w-nagao:#ff7fb6;
  --team:#5c94ff;
  --good:#2fd57e; --crit:#ff6b6b;
  --grad-a:#7c6bff; --grad-b:#ff6ba1; --grad-c:#ffc14d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 2px 10px rgba(0,0,0,.4),0 22px 52px -16px rgba(0,0,0,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'M PLUS Rounded 1c',system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:var(--ink); line-height:1.55; font-weight:500;
  background:
    radial-gradient(900px 500px at 105% -5%, color-mix(in srgb,var(--grad-a) 14%,transparent), transparent 60%),
    radial-gradient(800px 460px at -8% 4%, color-mix(in srgb,var(--grad-b) 11%,transparent), transparent 55%),
    radial-gradient(700px 500px at 55% 110%, color-mix(in srgb,var(--grad-c) 10%,transparent), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:4px 18px 96px}
/* ヘッダー */
header{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--bg1) 72%,transparent);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--border);
  padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:17px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b) 60%,var(--grad-c));
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--grad-b) 55%,transparent);
  animation:wiggle 6s ease-in-out infinite}
@keyframes wiggle{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-8deg)}94%{transform:rotate(8deg)}97%{transform:rotate(-4deg)}}
.brand .txt{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 55%,var(--grad-a)));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px;font-weight:700}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);
  width:41px;height:41px;border-radius:13px;font-size:17px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:.15s}
.icon-btn:active{transform:scale(.9) rotate(15deg)}
/* タブ */
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 8px;position:sticky;
  top:calc(66px + env(safe-area-inset-top));z-index:30;
  background:color-mix(in srgb,var(--bg1) 65%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  padding:10px 17px;border-radius:999px;font-size:14.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s;box-shadow:var(--shadow-sm);font-family:inherit}
nav.tabs button:hover{transform:translateY(-2px);color:var(--ink)}
nav.tabs button.active{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px -6px color-mix(in srgb,var(--grad-a) 60%,transparent)}
nav.tabs button.wtab.active{background:linear-gradient(135deg,var(--wc),color-mix(in srgb,var(--wc) 70%,#000))}
/* カード */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;margin-top:16px;position:relative}
.card h2{margin:0 0 3px;font-size:17px;font-weight:900;letter-spacing:.01em}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:15px}
.grid.cols3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.section-title{font-size:14.5px;font-weight:900;margin:24px 2px 6px;display:flex;align-items:center;gap:8px}
.tag{font-size:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink2);
  padding:2px 10px;border-radius:8px;font-weight:800}
/* ホームカード */
.nav-card{cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;overflow:hidden}
.nav-card::after{content:'';position:absolute;inset:0 0 auto 0;height:6px;border-radius:6px 6px 0 0;
  background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 40%,transparent))}
.nav-card:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 14px 36px -10px color-mix(in srgb,var(--ac) 45%,transparent)}
.nav-card:active{transform:scale(.98)}
.nav-card .row{display:flex;align-items:center;gap:15px}
.avatar{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:23px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 68%,#000));
  box-shadow:0 8px 18px -5px color-mix(in srgb,var(--ac) 60%,transparent)}
.avatar.round{border-radius:50%}
.nav-card .name{font-size:20px;font-weight:900}
.nav-card .desc{font-size:13px;color:var(--muted);margin-top:2px}
.running{font-size:13px;color:var(--good);font-weight:800;margin-top:3px;display:flex;align-items:center;gap:6px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chev{margin-left:auto;color:var(--muted);font-size:24px;font-weight:300}
/* ヒーロー */
.hero{overflow:hidden;background:
  radial-gradient(400px 200px at 90% -30%, color-mix(in srgb,var(--wc) 22%,transparent), transparent 70%),
  linear-gradient(135deg,color-mix(in srgb,var(--wc) 16%,var(--surface)),var(--surface) 62%)}
.hero .row{display:flex;align-items:center;gap:16px}
.hero .avatar{width:64px;height:64px;font-size:26px}
.hero h2{font-size:23px;margin:0;font-weight:900}
.hero .chips-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.hchip{font-size:12.5px;font-weight:800;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px;color:var(--ink2)}
/* タスクタイル */
.task-grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));margin-top:2px}
.task-tile{position:relative;border:1px solid var(--border);border-radius:22px;padding:18px;background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:13px;overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.task-tile::before{content:'';position:absolute;inset:0 auto 0 0;width:6px;
  background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 50%,transparent))}
.task-tile:hover{transform:translateY(-2px)}
.task-tile.active{box-shadow:0 0 0 2.5px var(--tc),0 14px 36px -8px color-mix(in srgb,var(--tc) 45%,transparent);
  animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2.5px var(--tc),0 14px 36px -8px color-mix(in srgb,var(--tc) 40%,transparent)}
  50%{box-shadow:0 0 0 2.5px var(--tc),0 14px 44px -6px color-mix(in srgb,var(--tc) 65%,transparent)}}
.thead{display:flex;align-items:center;gap:11px}
.tile-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:color-mix(in srgb,var(--tc) 15%,transparent)}
.tname{font-size:18.5px;font-weight:900}
.telapsed{font-variant-numeric:tabular-nums;font-size:42px;font-weight:900;letter-spacing:.5px;line-height:1;display:none;
  background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 60%,var(--ink)));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.task-tile.active .telapsed{display:block}
.thint{font-size:12.5px;color:var(--muted)}
.bigbtn{border:none;border-radius:16px;padding:17px;font-size:19px;font-weight:900;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:.03em;font-family:inherit;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.bigbtn::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.5s}
.bigbtn:hover::after{left:130%}
.bigbtn.start{background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#000));
  box-shadow:0 10px 24px -7px color-mix(in srgb,var(--tc) 65%,transparent)}
.bigbtn.stop{background:linear-gradient(135deg,var(--crit),color-mix(in srgb,var(--crit) 70%,#000));
  box-shadow:0 10px 24px -7px color-mix(in srgb,var(--crit) 55%,transparent)}
.bigbtn:active{transform:scale(.95)}
.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.discard{background:none;border:1px solid var(--border);color:var(--ink2);border-radius:11px;padding:8px 13px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
/* 雑務チップ */
.zchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.zchip{border:1.5px solid color-mix(in srgb,var(--zatsumu) 32%,var(--border));
  background:linear-gradient(180deg,color-mix(in srgb,var(--zatsumu) 9%,var(--surface)),color-mix(in srgb,var(--zatsumu) 4%,var(--surface)));
  color:var(--ink);border-radius:15px;padding:14px 10px;font-size:14.5px;font-weight:800;cursor:pointer;text-align:center;font-family:inherit;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s}
.zchip:hover{border-color:var(--zatsumu);background:color-mix(in srgb,var(--zatsumu) 16%,var(--surface));transform:translateY(-2px)}
.zchip:active{transform:scale(.92)}
/* 参加者チップ */
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:4px 0 2px}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--ink2);padding:10px 16px;border-radius:999px;
  font-size:15px;font-weight:800;cursor:pointer;user-select:none;transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .15s}
.chip:active{transform:scale(.92)}
.chip.on{background:linear-gradient(135deg,var(--team),color-mix(in srgb,var(--team) 70%,#000));border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -5px color-mix(in srgb,var(--team) 60%,transparent)}
/* タイムライン */
.timeline{margin-top:10px}
.tl-item{display:flex;gap:13px;position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-time{flex:0 0 46px;text-align:right;font-size:12.5px;color:var(--ink2);font-weight:800;font-variant-numeric:tabular-nums;padding-top:4px}
.tl-node{flex:0 0 16px;display:flex;justify-content:center;position:relative}
.tl-node::before{content:'';position:absolute;top:24px;bottom:-15px;width:2.5px;border-radius:2px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,transparent),var(--border))}
.tl-item:last-child .tl-node::before{display:none}
.tl-dot{width:16px;height:16px;border-radius:50%;background:var(--c);margin-top:5px;z-index:1;
  border:3px solid var(--surface);box-shadow:0 0 0 2.5px var(--c)}
.tl-dot.log{border-radius:5px}
.tl-body{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:11px 13px;
  display:flex;align-items:center;gap:10px;transition:.15s}
.tl-body:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--border));transform:translateX(2px)}
.tl-badge{font-size:11px;font-weight:900;padding:4px 10px;border-radius:8px;color:#fff;white-space:nowrap}
.tl-dur{font-weight:900;font-variant-numeric:tabular-nums}
.tl-range{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tl-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-grow{flex:1;min-width:8px}
/* 過去記録 */
.rec{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);font-size:14px}
.rec:last-child{border-bottom:none}
.badge{font-size:11px;font-weight:900;padding:3px 10px;border-radius:8px;color:#fff;white-space:nowrap}
.rec .dur{font-variant-numeric:tabular-nums;font-weight:900;min-width:52px}
.rec .time{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.rec .meta{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .grow{flex:1;min-width:0}
.mini{border:1px solid var(--border);background:var(--surface);color:var(--ink2);width:34px;height:34px;border-radius:11px;cursor:pointer;font-size:14px;transition:.13s}
.mini:hover{color:var(--ink);border-color:var(--muted)}
.mini:active{transform:scale(.85)}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
/* 統計タイル */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:15px 16px;position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.stat:hover{transform:translateY(-2px)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--ac,var(--grad-a)),color-mix(in srgb,var(--ac,var(--grad-a)) 35%,transparent))}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .val{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 60%,var(--ac,var(--grad-a))));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .val small{font-size:13.5px;font-weight:800;-webkit-text-fill-color:var(--ink2)}
/* フォーム */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{
  border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:13px;padding:10px 12px;font-size:15px;font-family:inherit;font-weight:600;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2.5px solid color-mix(in srgb,var(--grad-a) 45%,transparent);outline-offset:0;border-color:transparent}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:800}
/* チェックボックス行 */
.checkrow{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;
  background:var(--surface-2);transition:.15s;font-weight:800;font-size:15px;user-select:none}
.checkrow input{width:20px;height:20px;accent-color:var(--shashin);cursor:pointer}
.checkrow.on{border-color:var(--shashin);background:color-mix(in srgb,var(--shashin) 10%,var(--surface))}
/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(12,13,24,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:26px;width:100%;max-width:460px;padding:22px;
  box-shadow:0 34px 90px rgba(0,0,0,.42);max-height:90vh;overflow:auto;animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 16px;font-size:19px;font-weight:900}
.frow{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.frow label{font-size:13px;font-weight:800;color:var(--ink2)}
.frow input,.frow select,.frow textarea{width:100%}
textarea{resize:vertical;min-height:62px}
.modal-acts{display:flex;gap:10px;margin-top:4px}
.btn{border:none;border-radius:14px;padding:13px;font-size:16px;font-weight:900;cursor:pointer;flex:1;font-family:inherit;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;
  box-shadow:0 10px 22px -7px color-mix(in srgb,var(--grad-a) 55%,transparent)}
.btn.ghost{background:var(--surface-2);color:var(--ink2);border:1.5px solid var(--border)}
.btn.danger{background:linear-gradient(135deg,var(--crit),color-mix(in srgb,var(--crit) 70%,#000));color:#fff}
.btn.sm{padding:9px 15px;font-size:14px;flex:0 0 auto}
/* トースト */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140px);
  background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 82%,var(--grad-a)));color:var(--surface);
  padding:14px 19px;border-radius:16px;display:flex;align-items:center;gap:14px;z-index:120;
  box-shadow:0 14px 40px rgba(0,0,0,.38);transition:.35s cubic-bezier(.34,1.56,.64,1);font-size:14.5px;font-weight:800;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:none;color:var(--grad-c);font-weight:900;cursor:pointer;font-size:14.5px;font-family:inherit}
/* 紙吹雪 */
.confetti{position:fixed;width:10px;height:10px;z-index:150;pointer-events:none;border-radius:2px}
/* グラフ・表 */
svg text{font-family:inherit}
.bar-hover{fill:var(--ink);opacity:0;cursor:default}
.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 12px;border-radius:11px;
  font-size:12.5px;z-index:130;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px rgba(0,0,0,.3);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{text-align:left;padding:9px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
table.data th{color:var(--muted);font-weight:800;font-size:12px;position:sticky;top:0;background:var(--surface);z-index:1}
table.data tbody tr{transition:background .12s}
table.data tbody tr:hover{background:var(--surface-2)}
.tbl-scroll{overflow:auto;max-height:540px;border:1px solid var(--border);border-radius:16px;margin-top:10px}
.pill{font-size:11px;font-weight:900;padding:2px 9px;border-radius:7px;color:#fff}
.info{background:linear-gradient(135deg,color-mix(in srgb,var(--grad-a) 8%,var(--surface)),color-mix(in srgb,var(--grad-b) 6%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--grad-a) 22%,transparent);
  border-radius:16px;padding:13px 15px;font-size:13.5px;color:var(--ink2);margin-top:14px;line-height:1.65}
.info b{color:var(--ink)}
.file-in{display:none}
@media(max-width:540px){.rec .meta{display:none}.card{padding:16px}.tl-meta{max-width:110px}.telapsed{font-size:36px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">⏱</span><span class="txt">作業内容管理アプリ</span></div>
  <div class="clock" id="clock"></div>
  <button class="icon-btn" id="themeBtn" title="表示切替">🌙</button>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="view"></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div class="tooltip" id="tip"></div>

<script>
/* ============================================================
   作業タイム管理 — 単一ファイル / オフライン動作
   データは各ブラウザ内(localStorage)に保存されます
   ============================================================ */
const WORKERS=["飯田さん","久場さん","長尾さん"];
const WVAR={"飯田さん":"--w-iida","久場さん":"--w-kuba","長尾さん":"--w-nagao"};
const wcol=w=>`var(${WVAR[w]})`;
const wcolHex=w=>tcolor(WVAR[w]);

const ALL_TASKS={
  kenpin: {label:"検品",           cvar:"--kenpin",  icon:"🔍", unit:"個", timed:true,  fields:["product","count"]},
  satsuei:{label:"撮影",           cvar:"--satsuei", icon:"📷", unit:"個", timed:true,  fields:["count","retake"]},
  shashin:{label:"写真チェック",    cvar:"--shashin", icon:"🖼", unit:"",  timed:true,  fields:["recheck"]},
  amazon: {label:"Amazon画像貼付", cvar:"--amazon",  icon:"🏷", unit:"",  timed:true,  fields:[]},
  nouhin: {label:"納品",           cvar:"--nouhin",  icon:"📦", unit:"個", timed:true,  team:true, fields:["packNo","count"]},
  zatsumu:{label:"雑務",           cvar:"--zatsumu", icon:"🗂", unit:"件", timed:false, fields:["sub"]},
};
const SOLO_TIMED={kenpin:ALL_TASKS.kenpin, satsuei:ALL_TASKS.satsuei, shashin:ALL_TASKS.shashin, amazon:ALL_TASKS.amazon};
const ZATSUMU_SUB=["段ボール開封","自己配梱包","電話対応","付属品の処理","掃除","備品チェック","その他"];

function tcolor(c){if(!c)return '#888';if(c[0]==='#')return c;
  return getComputedStyle(document.documentElement).getPropertyValue(c).trim()||'#888';}

/* ---------- 保存 ---------- */
const KEY="worktimer_v2"; let mem=null;
function loadState(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem||{records:[],active:[],suppliers:[]};}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=loadState();
state.records=state.records||[];state.active=state.active||[];state.suppliers=state.suppliers||[];

/* ---------- utils ---------- */
const uid=()=>Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
const nowISO=()=>new Date().toISOString();
function fmtDate(iso){const d=new Date(iso);return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function fmtHM(iso){const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function durSec(a,b){return Math.max(0,Math.round((new Date(b)-new Date(a))/1000));}
function fmtDur(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function fmtDurShort(s){const h=Math.floor(s/3600),m=Math.round(s%3600/60);return h>0?`${h}時間${m}分`:`${m}分`;}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isoDay(iso){const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function monthKey(iso){const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
const thisMonthKey=()=>monthKey(nowISO());
function monthLabel(mk){const[y,m]=mk.split('-');return `${y}年${parseInt(m)}月`;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const known=r=>ALL_TASKS[r.cat];

/* ---------- 紙吹雪 ---------- */
const CONF_COLORS=['#6a5bff','#e8447f','#ffb020','#10b07e','#0aa8cf','#f26a2f'];
function confetti(){
  const n=26,cx=window.innerWidth/2,cy=window.innerHeight-90;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='confetti';
    el.style.background=CONF_COLORS[i%CONF_COLORS.length];
    el.style.left=cx+'px';el.style.top=cy+'px';
    if(i%3===0)el.style.borderRadius='50%';
    document.body.appendChild(el);
    const ang=(-90+(Math.random()*140-70))*Math.PI/180, v=180+Math.random()*260;
    const dx=Math.cos(ang)*v, dy=Math.sin(ang)*v;
    el.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${dx}px,${dy+150}px) rotate(${360+Math.random()*360}deg)`,opacity:0}
    ],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>el.remove();
  }
}

/* ---------- routing ---------- */
let route={page:"home",worker:null};
const TABS=[{id:"home",label:"🏠 ホーム"},...WORKERS.map((w,i)=>({id:"w"+i,label:w,worker:w})),
  {id:"team",label:"👥 全員作業"},{id:"admin",label:"📊 管理者"},{id:"shiire",label:"🔗 仕入表連携"}];
function renderTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  TABS.forEach(t=>{const b=document.createElement('button');b.textContent=t.label;
    const act=(route.page==='worker'&&t.worker===route.worker)||(route.page===t.id);
    if(t.worker){b.classList.add('wtab');b.style.setProperty('--wc',wcol(t.worker));}
    if(act)b.classList.add('active');
    b.onclick=()=>t.worker?go('worker',t.worker):go(t.id);
    el.appendChild(b);});
}
function go(page,worker){route={page:worker?'worker':page,worker:worker||null};render();window.scrollTo(0,0);}

/* ---------- timers ---------- */
const findActive=(cat,wkey)=>state.active.find(a=>a.cat===cat&&a.wkey===wkey);
function startTimer(cat,workers){const wkey=workers.slice().sort().join(',');if(findActive(cat,wkey))return;
  state.active.push({id:uid(),cat,workers:workers.slice(),wkey,start:nowISO()});saveState();render();}
function stopTimer(id){const a=state.active.find(x=>x.id===id);if(a)openStopModal(a);}
function discardTimer(id){state.active=state.active.filter(x=>x.id!==id);saveState();render();toast("計測を取り消しました");}

/* ---------- 雑務クイック記録 ---------- */
function logZatsumu(workers,sub,note){
  if(!workers.length){toast('参加者を選んでください');return;}
  const id=uid(),t=nowISO();
  addRec({id,cat:'zatsumu',workers:workers.slice(),start:t,end:t,sec:0,
    count:null,product:null,packNo:null,sub,retake:false,recheck:false,note:note||''});
  render();confetti();
  toast(`🗂 雑務「${sub}」を記録！`,()=>{state.records=state.records.filter(r=>r.id!==id);pushDelete(id);saveState();render();});
}
function openZatsumuOther(workers){
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3 style="color:${tcolor('--zatsumu')}">🗂 雑務を記録</h3>
    ${fieldRow('作業内容',`<input type="text" id="z_sub" placeholder="例: Amazon返品処理">`)}
    ${fieldRow('備考',`<textarea id="z_note" placeholder="任意"></textarea>`)}
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">対象: <b style="color:var(--ink)">${workers.join('・')}</b>（時間計測なし）</div>
    <div class="modal-acts"><button class="btn ghost" onclick="closeModal()">戻る</button>
    <button class="btn primary" id="z_save">記録する</button></div>`;
  showModal();
  document.getElementById('z_save').onclick=()=>{
    const sub=document.getElementById('z_sub').value.trim()||'その他';
    const note=document.getElementById('z_note').value.trim();
    closeModal();logZatsumu(workers,sub,note);};
}

/* ---------- 停止モーダル ---------- */
function openStopModal(a){
  const t=ALL_TASKS[a.cat],end=nowISO(),sec=durSec(a.start,end);
  let f='';
  const autoKenpin = (a.cat==='kenpin' && scfg.url);
  if(t.fields.includes('product'))f+=fieldRow('商品コード / 商品名','<input type="text" id="m_product" placeholder="例: 553 / 商品名">');
  if(t.fields.includes('packNo')) f+=fieldRow('梱包No.','<input type="text" id="m_packNo" placeholder="例: 328">');
  if(t.fields.includes('count'))  f+=fieldRow(`${t.label}個数${autoKenpin?'（仕入表から自動入力・修正可）':''}`,`<input type="number" id="m_count" min="0" step="1" placeholder="0" inputmode="numeric">`);
  if(autoKenpin) f+=`<div class="thint" id="m_autocnt" style="margin:-6px 0 12px">🧮 仕入表の色変更を集計中…</div>`;
  if(t.fields.includes('retake')) f+=`<div class="frow"><label class="checkrow" id="m_retakeRow"><input type="checkbox" id="m_retake"> 撮り直し</label></div>`;
  if(t.fields.includes('recheck'))f+=`<div class="frow"><label class="checkrow" id="m_recheckRow"><input type="checkbox" id="m_recheck"> 再チェック（2回目以降のチェック）</label></div>`;
  f+=fieldRow('備考',`<textarea id="m_note" placeholder="メモ (任意)"></textarea>`);
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3 style="color:${tcolor(t.cvar)}">${t.icon} ${t.label} を終了</h3>
    <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
      ${miniInfo('作業者',a.workers.join('・'))}${miniInfo('開始',fmtHM(a.start))}${miniInfo('終了',fmtHM(end))}
      <div><div style="font-size:12px;color:var(--muted)">作業時間</div><div style="font-weight:900;color:${tcolor(t.cvar)};font-variant-numeric:tabular-nums;font-size:17px">${fmtDur(sec)}</div></div>
    </div>${f}
    <div class="modal-acts"><button class="btn ghost" onclick="closeModal()">戻る</button>
    <button class="btn primary" id="m_save">記録する</button></div>`;
  showModal();
  ['m_retake','m_recheck'].forEach(id=>{const cb=document.getElementById(id);
    if(cb)cb.onchange=()=>cb.closest('.checkrow').classList.toggle('on',cb.checked);});
  // 検品: 仕入表の色変更から個数を自動入力(手修正した場合は上書きしない)
  let autoRe=0;
  if(autoKenpin){
    const inp=document.getElementById('m_count');
    if(inp)inp.oninput=()=>inp.dataset.user='1';
    const apply=()=>{
      const box=document.getElementById('m_autocnt'); if(!box)return;
      const {cnt,re}=kenpinAutoCounts(a.start,end,a.workers[0]); autoRe=re;
      const inp2=document.getElementById('m_count');
      if(inp2&&!inp2.dataset.user)inp2.value=cnt;
      box.innerHTML=`🧮 自動カウント: 検品 <b>${cnt}個</b>（灰→色変更・同一No.は1個）・ 再検品 <b style="color:var(--satsuei)">${re}件</b>（赤→他色 / 平均に含めず）
        <a href="#" id="m_reauto" style="margin-left:8px;font-weight:800;color:var(--nouhin);text-decoration:none">${shiireData.loading?'集計中…':'↻ 再集計'}</a>`;
      const ra=document.getElementById('m_reauto');
      if(ra)ra.onclick=ev=>{ev.preventDefault();fetchChanges(true,true);apply();};
    };
    window.__modalAuto=apply;
    fetchChanges(true,true); apply();
  }
  document.getElementById('m_save').onclick=()=>{
    window.__modalAuto=null;
    addRec({id:uid(),cat:a.cat,workers:a.workers.slice(),start:a.start,end,sec,reCount:autoRe||0,
      count:t.fields.includes('count')?(parseInt(document.getElementById('m_count').value)||0):null,
      product:t.fields.includes('product')?document.getElementById('m_product').value.trim():null,
      packNo:t.fields.includes('packNo')?document.getElementById('m_packNo').value.trim():null,
      sub:null,
      retake:t.fields.includes('retake')?document.getElementById('m_retake').checked:false,
      recheck:t.fields.includes('recheck')?document.getElementById('m_recheck').checked:false,
      note:document.getElementById('m_note').value.trim()});
    state.active=state.active.filter(x=>x.id!==a.id);
    saveState();closeModal();render();confetti();toast(`${t.icon} ${t.label}を記録しました (${fmtDur(sec)})`);
    if(scfg.url)setTimeout(()=>fetchChanges(true),600); // 計測終了時に仕入表の変更点を取得
  };
}
const miniInfo=(l,v)=>`<div><div style="font-size:12px;color:var(--muted)">${l}</div><div style="font-weight:900;font-variant-numeric:tabular-nums;font-size:17px">${esc(v)}</div></div>`;
const fieldRow=(l,i)=>`<div class="frow"><label>${l}</label>${i}</div>`;

/* ---------- 編集モーダル ---------- */
function openEditModal(recId){
  const r=state.records.find(x=>x.id===recId);if(!r)return;const t=ALL_TASKS[r.cat];
  const day=isoDay(r.start),startHM=fmtHM(r.start),endHM=fmtHM(r.end);
  const multi=(t.team||r.workers.length>1);
  const wsel=multi
    ?`<div class="frow"><label>作業者</label><div class="chips" id="e_workers">${WORKERS.map(w=>`<div class="chip ${r.workers.includes(w)?'on':''}" data-w="${w}">${w}</div>`).join('')}</div></div>`
    :`<div class="frow"><label>作業者</label><select id="e_worker">${WORKERS.map(w=>`<option ${r.workers[0]===w?'selected':''}>${w}</option>`).join('')}</select></div>`;
  let extra='';
  if(t.fields.includes('product'))extra+=fieldRow('商品コード / 商品名',`<input type="text" id="e_product" value="${esc(r.product)}">`);
  if(t.fields.includes('packNo')) extra+=fieldRow('梱包No.',`<input type="text" id="e_packNo" value="${esc(r.packNo)}">`);
  if(t.fields.includes('sub'))    extra+=fieldRow('作業種別',`<select id="e_sub">${ZATSUMU_SUB.concat(r.sub&&!ZATSUMU_SUB.includes(r.sub)?[r.sub]:[]).map(s=>`<option ${s===r.sub?'selected':''}>${s}</option>`).join('')}</select>`);
  if(t.fields.includes('count'))  extra+=fieldRow(`${t.label}個数`,`<input type="number" id="e_count" min="0" value="${r.count??0}">`);
  if(t.fields.includes('retake')) extra+=`<div class="frow"><label class="checkrow ${r.retake?'on':''}"><input type="checkbox" id="e_retake" ${r.retake?'checked':''}> 撮り直し</label></div>`;
  if(t.fields.includes('recheck'))extra+=`<div class="frow"><label class="checkrow ${r.recheck?'on':''}"><input type="checkbox" id="e_recheck" ${r.recheck?'checked':''}> 再チェック（2回目以降）</label></div>`;
  const timeFields=t.timed
    ?`<div style="display:flex;gap:10px"><div style="flex:1">${fieldRow('開始',`<input type="time" id="e_start" value="${startHM}">`)}</div><div style="flex:1">${fieldRow('終了',`<input type="time" id="e_end" value="${endHM}">`)}</div></div>`
    : fieldRow('時刻',`<input type="time" id="e_time" value="${startHM}">`);
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3 style="color:${tcolor(t.cvar)}">${t.icon} ${t.label} を編集</h3>
    ${wsel}${fieldRow('日付',`<input type="date" id="e_date" value="${day}">`)}${timeFields}${extra}
    ${fieldRow('備考',`<textarea id="e_note">${esc(r.note)}</textarea>`)}
    <div class="modal-acts"><button class="btn danger sm" id="e_del">削除</button>
    <button class="btn ghost" onclick="closeModal()">戻る</button><button class="btn primary" id="e_save">保存</button></div>`;
  showModal();
  if(multi)box.querySelectorAll('#e_workers .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
  ['e_retake','e_recheck'].forEach(id=>{const cb=document.getElementById(id);
    if(cb)cb.onchange=()=>cb.closest('.checkrow').classList.toggle('on',cb.checked);});
  document.getElementById('e_del').onclick=()=>{if(confirm('この記録を削除しますか？')){state.records=state.records.filter(x=>x.id!==recId);pushDelete(recId);saveState();closeModal();render();toast('削除しました');}};
  document.getElementById('e_save').onclick=()=>{
    const d=document.getElementById('e_date').value;
    if(t.timed){
      const s=document.getElementById('e_start').value,e=document.getElementById('e_end').value;
      let si=new Date(`${d}T${s}:00`).toISOString(),ei=new Date(`${d}T${e}:00`).toISOString();
      if(new Date(ei)<new Date(si))ei=new Date(new Date(ei).getTime()+864e5).toISOString();
      r.start=si;r.end=ei;r.sec=durSec(si,ei);
    }else{
      const ti=new Date(`${d}T${document.getElementById('e_time').value}:00`).toISOString();
      r.start=ti;r.end=ti;r.sec=0;
    }
    if(multi){r.workers=[...box.querySelectorAll('#e_workers .chip.on')].map(c=>c.dataset.w);if(!r.workers.length)r.workers=[WORKERS[0]];}
    else r.workers=[document.getElementById('e_worker').value];
    if(t.fields.includes('product'))r.product=document.getElementById('e_product').value.trim();
    if(t.fields.includes('packNo')) r.packNo=document.getElementById('e_packNo').value.trim();
    if(t.fields.includes('sub'))    r.sub=document.getElementById('e_sub').value;
    if(t.fields.includes('count'))  r.count=parseInt(document.getElementById('e_count').value)||0;
    if(t.fields.includes('retake')) r.retake=document.getElementById('e_retake').checked;
    if(t.fields.includes('recheck'))r.recheck=document.getElementById('e_recheck').checked;
    r.note=document.getElementById('e_note').value.trim();
    r.updatedAt=Date.now();queuePush(r);
    saveState();closeModal();render();toast('保存しました');
  };
}

/* ---------- modal / toast ---------- */
const showModal=()=>document.getElementById('modalBg').classList.add('show');
const closeModal=()=>{window.__modalAuto=null;document.getElementById('modalBg').classList.remove('show');};
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
let toastTimer=null;
function toast(msg,undo){const el=document.getElementById('toast');
  el.innerHTML=esc(msg)+(undo?' <button id="undoBtn">元に戻す</button>':'');el.classList.add('show');
  if(undo)document.getElementById('undoBtn').onclick=()=>{undo();el.classList.remove('show');};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),undo?6000:2600);}

/* ============================================================
   平均タイム
   ============================================================ */
function avgFor(rs,t){
  if(!rs.length)return null;
  if(!t.timed)return {v:rs.length,unit:'件'};
  if(t.fields.includes('count')){const cnt=rs.reduce((s,r)=>s+(r.count||0),0);const sec=rs.filter(r=>r.count>0).reduce((s,r)=>s+r.sec,0);return {v:cnt?Math.round(sec/cnt/60*10)/10:0,unit:'分/個'};}
  return {v:Math.round(rs.reduce((s,r)=>s+r.sec,0)/rs.length/60*10)/10,unit:'分/回'};
}
function thisMonthAvgStats(recs,cats){
  const cur=thisMonthKey(),mrecs=recs.filter(r=>known(r)&&monthKey(r.start)===cur);
  const tiles=cats.map(c=>{const t=ALL_TASKS[c];const rs=mrecs.filter(r=>r.cat===c);const a=avgFor(rs,t);
    return `<div class="stat" style="--ac:${tcolor(t.cvar)}"><div class="label" style="color:${tcolor(t.cvar)};font-weight:800">${t.icon} ${t.label}</div>
      <div class="val">${a?a.v:'—'}<small> ${a?a.unit:(t.timed?(t.fields.includes('count')?'分/個':'分/回'):'件')}</small></div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">今月 ${rs.length}件</div></div>`;}).join('');
  return `<div class="stats">${tiles}</div>`;
}
function monthlyAvgTable(recs,cats){
  recs=recs.filter(known);
  const months=[...new Set(recs.map(r=>monthKey(r.start)))].sort().reverse();
  if(!months.length)return `<div class="empty">記録がありません</div>`;
  const cur=thisMonthKey();
  const head=`<tr><th>月</th>${cats.map(c=>{const t=ALL_TASKS[c];return `<th style="color:${tcolor(t.cvar)}">${t.label}<br><span style="font-weight:500;color:var(--muted)">${t.timed?(t.fields.includes('count')?'分/個':'分/回'):'件'}</span></th>`;}).join('')}<th>合計時間</th></tr>`;
  const rows=months.map(mk=>{const mrecs=recs.filter(r=>monthKey(r.start)===mk);
    const cells=cats.map(c=>{const t=ALL_TASKS[c];const a=avgFor(mrecs.filter(r=>r.cat===c),t);
      return `<td style="font-variant-numeric:tabular-nums;font-weight:800">${a?a.v:'<span style="color:var(--muted);font-weight:400">—</span>'}</td>`;}).join('');
    const tot=mrecs.reduce((s,r)=>s+r.sec,0);
    return `<tr ${mk===cur?'style="background:color-mix(in srgb,var(--grad-a) 8%,transparent)"':''}>
      <td style="font-weight:900;white-space:nowrap">${monthLabel(mk)}${mk===cur?' <span class="tag">今月</span>':''}</td>${cells}

}

/* ---------- meta builder ---------- */
function recMeta(r,t){
  const meta=[];
  if(r.workers.length>1)meta.push(r.workers.join('・'));
  if(r.product)meta.push('商品:'+r.product);
  if(r.packNo)meta.push('No.'+r.packNo);
  if(r.sub)meta.push(r.sub);
  if(r.count!=null&&t.fields.includes('count'))meta.push(r.count+t.unit);
  if(r.retake)meta.push('撮り直し');
  if(r.reCount)meta.push(`🔧再検品${r.reCount}件`);
  if(t.fields.includes('recheck'))meta.push(r.recheck?'🔁 再チェック':'✅ 1回目');
  if(r.note)meta.push('📝'+r.note);
  return meta;
}

/* ---------- timeline ---------- */
function timeline(recs){
  if(!recs.length)return `<div class="empty">まだ記録がありません</div>`;
  const asc=recs.slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
  return `<div class="timeline">${asc.map(r=>{const t=ALL_TASKS[r.cat],c=tcolor(t.cvar);
    const meta=recMeta(r,t).filter(m=>!(r.workers.length>1&&m===r.workers.join('・'))&&true);
    const metaAll=recMeta(r,t);
    const right=t.timed?`<span class="tl-dur" style="color:${c}">${fmtDur(r.sec)}</span><span class="tl-range">${fmtHM(r.start)}–${fmtHM(r.end)}</span>`
      :`<span class="tl-range">記録</span>`;
    return `<div class="tl-item" style="--c:${c}">
      <div class="tl-time">${fmtHM(r.start)}</div>
      <div class="tl-node"><div class="tl-dot ${t.timed?'':'log'}"></div></div>
      <div class="tl-body">
        <span class="tl-badge" style="background:${c}">${t.icon} ${t.label}</span>
        ${right}<span class="tl-grow"></span>
        <span class="tl-meta">${esc(metaAll.join(' ・ '))}</span>
        <button class="mini" data-edit="${r.id}">✎</button>
      </div></div>`;}).join('')}</div>`;
}

/* ---------- record list ---------- */
function recListHtml(recs){
  if(!recs.length)return `<div class="empty">記録がありません</div>`;
  return `<div>${recs.map(r=>{const t=ALL_TASKS[r.cat];const meta=recMeta(r,t);
    return `<div class="rec">
      <span class="badge" style="background:${tcolor(t.cvar)}">${t.label}</span>
      <span class="dur">${t.timed?fmtDur(r.sec):'—'}</span>
      <span class="time">${fmtDate(r.start)} ${fmtHM(r.start)}${t.timed?'-'+fmtHM(r.end):''}</span>
      <span class="grow"></span><span class="meta">${esc(meta.join(' ・ '))}</span>
      <button class="mini" data-edit="${r.id}">✎</button></div>`;}).join('')}</div>`;
}

function matrixTable(recs){
  const cols=['kenpin','satsuei','shashin','amazon','nouhin','zatsumu'];
  const rows=WORKERS.map(w=>{const cells=cols.map(c=>{const t=ALL_TASKS[c];const rs=recs.filter(r=>r.cat===c&&r.workers.includes(w));
      if(!rs.length)return `<td style="color:var(--muted)">—</td>`;
      return t.timed?`<td style="font-variant-numeric:tabular-nums">${fmtDurShort(rs.reduce((s,r)=>s+r.sec,0))}</td>`:`<td style="font-variant-numeric:tabular-nums">${rs.length}件</td>`;}).join('');
    const tot=recs.filter(r=>r.workers.includes(w)&&ALL_TASKS[r.cat].timed).reduce((s,r)=>s+r.sec,0);
    return `<tr><td style="font-weight:900">${w}</td>${cells}<td style="font-weight:900;font-variant-numeric:tabular-nums">${tot?fmtDurShort(tot):'—'}</td></tr>`;}).join('');
  return `<div class="tbl-scroll"><table class="data"><thead><tr><th>作業者</th>${cols.map(c=>`<th>${ALL_TASKS[c].label}</th>`).join('')}<th>合計時間</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function dataTable(recs){
  if(!recs.length)return `<div class="empty">条件に合う記録がありません</div>`;
  const rows=recs.map(r=>{const t=ALL_TASKS[r.cat];
    const info=[r.product&&('商品:'+r.product),r.packNo&&('No.'+r.packNo),r.sub,(r.count!=null&&t.fields.includes('count'))&&(r.count+t.unit),
      r.retake&&'撮り直し',t.fields.includes('recheck')&&(r.recheck?'再チェック':'1回目')].filter(Boolean).join(' / ');
    return `<tr><td>${fmtDate(r.start)}</td><td><span class="pill" style="background:${tcolor(t.cvar)}">${t.label}</span></td>
      <td>${r.workers.join('・')}</td><td style="font-variant-numeric:tabular-nums">${t.timed?fmtHM(r.start)+'-'+fmtHM(r.end):fmtHM(r.start)}</td>
      <td style="font-variant-numeric:tabular-nums;font-weight:800">${t.timed?fmtDur(r.sec):'—'}</td>
      <td style="max-width:190px;overflow:hidden;text-overflow:ellipsis">${esc(info)}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${esc(r.note||'')}</td>
      <td><button class="mini" data-edit="${r.id}">✎</button></td></tr>`;}).join('');
  return `<div class="tbl-scroll"><table class="data"><thead><tr><th>日付</th><th>作業</th><th>作業者</th><th>時刻</th><th>時間</th><th>詳細</th><th>備考</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function barChart(data){
  data=data.filter(d=>d.val>0);
  if(!data.length)return `<div class="empty">データがありません</div>`;
  const max=Math.max(...data.map(d=>d.val)),W=460,rowH=46,padL=118,padR=62,H=data.length*rowH+8;
  const bars=data.map((d,i)=>{const y=i*rowH+8,bw=Math.max(4,(d.val/max)*(W-padL-padR));
    return `<text x="${padL-10}" y="${y+19}" text-anchor="end" font-size="13" fill="var(--ink2)" font-weight="800">${esc(d.label)}</text>
      <rect x="${padL}" y="${y+5}" width="${bw}" height="20" rx="6" style="fill:${d.color}"></rect>
      <text x="${padL+bw+9}" y="${y+20}" font-size="12.5" fill="var(--ink2)" font-weight="700" font-variant-numeric="tabular-nums">${fmtDurShort(d.val)}</text>
      <rect class="bar-hover" x="0" y="${y}" width="${W}" height="${rowH}" data-tt="${esc(d.label)}: ${fmtDurShort(d.val)}"></rect>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">${bars}</svg>`;
}

    }catch(e){lines.push('① fetch方式: ❌ '+(e.name==='AbortError'?'タイムアウト':(e.message||'失敗')));}

      s.onerror=()=>{clearTimeout(to);delete window[cb];s.remove();lines.push('② script方式: ❌ 読込エラー');res();};
      s.src=ping+'&callback='+cb;document.body.appendChild(s);
    });
    // ③ 変更点取得(本番と同じ処理)のテスト
    try{
      const d=await gasGet(url+(url.includes('?')?'&':'?')+'mode=changes&since='+todayStr());

    }catch(e){lines.push('③ 変更点取得: ❌ '+(e.message||'失敗'));}
    lines.push('この結果を送ってもらえれば原因を特定できます');
    out.innerHTML=lines.map(esc).join('<br>');
  });
  document.querySelectorAll('[data-chg-refresh]').forEach(b=>b.onclick=()=>fetchChanges(false,true));
  if(scfg.url&&(route.page==='worker'||route.page==='shiire')&&!shiireData.fetchedAt&&!shiireData.loading)fetchChanges(true);
  bindTooltips();startElapsedLoop();
}

/* ---------- CSV ---------- */
function csvE(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,content){const blob=new Blob(["﻿"+content],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const recs=filteredRecords();
  const head=['日付','作業','作業者','開始','終了','作業時間(分)','個数','商品コード','梱包No','種別','撮り直し','再チェック','備考'];
  const rows=recs.map(r=>{const t=ALL_TASKS[r.cat];return [isoDay(r.start),t.label,r.workers.join('・'),fmtHM(r.start),t.timed?fmtHM(r.end):'',
    t.timed?Math.round(r.sec/60):'',r.count??'',r.product||'',r.packNo||'',r.sub||'',r.retake?'○':'',r.recheck?'○':'',r.note||''].map(csvE).join(',');});
  download('作業タイム記録_'+todayStr()+'.csv',[head.join(','),...rows].join('\n'));toast('CSVを出力しました');}
function exportKenpin(){const recs=state.records.filter(r=>r.cat==='kenpin');
  const head=['日付','商品コード/名','検品者','個数','作業時間(分)','備考'];
  const rows=recs.map(r=>[isoDay(r.start),r.product||'',r.workers.join('・'),r.count??'',Math.round(r.sec/60),r.note||''].map(csvE).join(','));
  download('検品結果_'+todayStr()+'.csv',[head.join(','),...rows].join('\n'));toast('検品結果を出力しました');}
function parseCSV(text){const rows=[];let row=[],cur='',q=false;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()!==''));}
function importShiire(file){if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const rows=parseCSV(rd.result);if(!rows.length){toast('データがありません');return;}
    let st=0;if(/コード|商品|名|code|name/i.test(rows[0].join('')))st=1;
    state.suppliers=rows.slice(st).map(r=>({code:(r[0]||'').trim(),name:(r[1]||'').trim()})).filter(s=>s.code||s.name);
    saveState();render();toast(`仕入表 ${state.suppliers.length}件を読み込みました`);};rd.readAsText(file);}
function importRecordsCSV(file){if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const rows=parseCSV(rd.result);if(rows.length<2){toast('データがありません');return;}
    const byLabel={};Object.entries(ALL_TASKS).forEach(([c,t])=>byLabel[t.label]=c);let n=0;
    rows.slice(1).forEach(r=>{const[day,label,workers,st,en,min,count,product,packNo,sub,retake,recheck,note]=r;
      const cat=byLabel[(label||'').trim()];if(!cat||!day||!st)return;const t=ALL_TASKS[cat];
      const si=new Date(`${day}T${st}:00`).toISOString();
      let ei=t.timed?(en?new Date(`${day}T${en}:00`).toISOString():new Date(new Date(si).getTime()+(parseInt(min)||0)*60000).toISOString()):si;
      addRec({id:uid(),cat,workers:(workers||WORKERS[0]).split('・').map(s=>s.trim()).filter(Boolean),
        start:si,end:ei,sec:t.timed?durSec(si,ei):0,count:count?parseInt(count):null,product:product||null,packNo:packNo||null,
        sub:sub||null,retake:retake==='○',recheck:recheck==='○',note:note||''});n++;});
    saveState();render();toast(`${n}件の記録を読み込みました`);};rd.readAsText(file);}

/* GAS呼び出し: fetch(標準・CORS)を優先し、失敗したらJSONP(scriptタグ)に自動フォールバック */
async function gasGet(url){
  let fetchErr='';
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),30000);
    const res=await fetch(url,{signal:ctl.signal,redirect:'follow'});
    clearTimeout(t);
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }catch(e){fetchErr=e.name==='AbortError'?'timeout':(e.message||'fetch failed');}
  return new Promise((resolve,reject)=>{
    const cb='__gcb'+Math.floor(Math.random()*1e9);
    const s=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject(new Error('タイムアウト/'+fetchErr));},30000);
    function cleanup(){delete window[cb];clearTimeout(to);s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('読込ブロック/'+fetchErr));};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.body.appendChild(s);
  });
}
function fetchChanges(silent,force){
  if(!scfg.url)return;
  if(shiireData.loading)return; // 同時多重取得を防止
  clearTimeout(shiireRetryTimer);
  shiireData.loading=true;
  if(!silent)renderChangePanels();
  const url=scfg.url+(scfg.url.includes('?')?'&':'?')+'mode=changes&since='+todayStr()+(force?'&force=1':'');
  gasGet(url).then(data=>{
    if(data&&data.ok===false)throw new Error('サーバー側エラー: '+(data.error||'不明'));
    shiireData={changes:(data&&data.changes)||[],fetchedAt:new Date(),error:null,loading:false};
    renderChangePanels();
  }).catch(err=>{
    shiireData.loading=false;shiireData.error='再取得に失敗しました（'+err.message+'）';
    renderChangePanels();
    shiireRetryTimer=setTimeout(()=>fetchChanges(true),15000); // 15秒後に自動再試行
  });
}

/* ============================================================
   記録のデータ同期 (全PCで共有)
   保存/編集/削除のたびにサーバー(Apps Script)へ送信し、
   1分毎+起動時に取得してマージする。オフライン時はキューに保持
   ============================================================ */
const SYNCQ_KEY='worktimer_syncq';
let syncQ=(()=>{try{return JSON.parse(localStorage.getItem(SYNCQ_KEY))||[];}catch(e){return [];}})();
let flushing=false, lastSyncAt=null;
function saveQ(){try{localStorage.setItem(SYNCQ_KEY,JSON.stringify(syncQ));}catch(e){}}
function queuePush(rec){
  if(!rec||!rec.id)return;
  const copy=JSON.parse(JSON.stringify(rec));
  syncQ=syncQ.filter(q=>q.id!==copy.id||q.deleted!==copy.deleted);
  syncQ.push(copy);saveQ();flushQ();
}
async function flushQ(){
  if(!scfg.url||flushing||!syncQ.length)return;
  flushing=true;
  try{
    while(syncQ.length){
      const rec=syncQ[0];
      const d=await gasGet(scfg.url+(scfg.url.includes('?')?'&':'?')+'mode=push&rec='+encodeURIComponent(JSON.stringify(rec)));
      if(!d||d.ok===false)break;
      syncQ.shift();saveQ();lastSyncAt=new Date();
    }
  }catch(e){}
  flushing=false;
}
async function pullRecords(){
  if(!scfg.url)return;
  try{
    const d=await gasGet(scfg.url+(scfg.url.includes('?')?'&':'?')+'mode=pull');
    if(!d||!d.records)return;
    const byId={};state.records.forEach(r=>byId[r.id]=r);
    let changed=false;
    const serverIds=new Set();
    d.records.forEach(sr=>{
      serverIds.add(sr.id);
      const loc=byId[sr.id];
      if(sr.deleted){ if(loc){state.records=state.records.filter(x=>x.id!==sr.id);changed=true;} return; }
      if(!loc){ state.records.push(sr); changed=true; }
      else if((sr.updatedAt||0)>(loc.updatedAt||0)){ Object.assign(loc,sr); changed=true; }
    });
    // サーバーに無いローカル記録(過去分・オフライン作成分)をアップロード
    const queued=new Set(syncQ.map(q=>q.id));
    state.records.forEach(r=>{ if(!serverIds.has(r.id)&&!queued.has(r.id)&&!r.sample){ r.updatedAt=r.updatedAt||Date.now(); queuePush(r); } });
    if(changed){ saveState(); render(); }
    lastSyncAt=new Date();
  }catch(e){}
}
/* 記録の追加/削除ヘルパー(同期付き) */
function addRec(rec){ rec.updatedAt=Date.now(); state.records.push(rec); saveState(); queuePush(rec); }
function pushDelete(id){ queuePush({id:id, deleted:true, updatedAt:Date.now()}); }

const CHG_COLOR={'白':'#ffffff','白系':'#f2f2f2','黒':'#333333','灰':'#999999','赤':'#e23b3b','桃':'#f27bb0','柿':'#f58220','黄':'#f5c400','緑':'#3bb545','水':'#40c8e0','青':'#3a6df0','紫':'#8a63f6'};

/* 検品の自動カウント: 計測時間内のB列色変更を集計
   ・灰→他色 = 検品1個。ただし同一No.は1日1個まで(その日最初に灰→色になった計測に計上)
   ・赤→(白・灰以外) = 再検品(別枠・平均に含めない)。こちらは同一No.でも毎回カウント */
function kenpinAutoCounts(startISO,endISO,worker){
  const s=new Date(startISO).getTime(), e=new Date(endISO).getTime()+180000; // 記録遅延ぶん終了後3分まで
  const firstGray={}; let re=0;
  (shiireData.changes||[]).forEach(c=>{
    if(c.col!=='B列色')return;
    const t=new Date(c.t).getTime();
    // タイマーを回している本人の変更のみ数える(実行者不明分は含める。複数人登録「A・B」は各人にマッチ)
    if(worker&&c.editor&&c.editor!=='不明'&&c.editor!=='未設定'&&String(c.editor).split('・').indexOf(worker)<0)return;
    if(c.oldV==='灰'){
      const no=c.no||('row'+c.row);
      if(!(no in firstGray)||t<firstGray[no]) firstGray[no]=t; // 同一No.はその日の最初の1回だけ
    }else if(c.oldV==='赤'&&c.newV!=='白'&&c.newV!=='灰'){
      if(t>=s&&t<=e) re++; // 再検品は毎回カウント
    }
  });
  let cnt=0;
  Object.values(firstGray).forEach(t=>{ if(t>=s&&t<=e) cnt++; });
  return {cnt,re};
}

function changesPanelHtml(full,worker){
  const head=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <h2 style="margin:0">📥 仕入表の変更点（今日）</h2>
    ${shiireData.fetchedAt?`<span class="tag">${fmtHM(shiireData.fetchedAt.toISOString())} 取得</span>`:''}
    <div style="margin-left:auto"><button class="btn ghost sm" data-chg-refresh>↻ 更新</button></div></div>
    <div class="sub" style="margin-top:3px">B列の色変更(白以外)・マスタ列の手修正・売値・仕入額・コンディション・管理番号・行の増減を自動表示。計測終了時と表示中1分毎に自動取得</div>`;
  if(!scfg.url) return head+`<div class="info" style="margin-top:8px">まだ仕入表と接続されていません。「仕入表連携」タブの<b>接続設定</b>にウェブアプリURLを貼り付けてください（セットアップ手順も同タブにあります）。</div>`;
  if(shiireData.loading&&!shiireData.fetchedAt) return head+`<div class="empty">読み込み中…</div>`;
  // エラーでも過去に取得済みのデータがあれば表示を維持し、注意書きだけ添える
  const errNote=shiireData.error
    ?`<div class="thint" style="margin-top:8px;color:var(--satsuei)">⚠ ${esc(shiireData.error)}（${shiireData.fetchedAt?fmtHM(shiireData.fetchedAt.toISOString())+' 取得分を表示中・':''}15秒後に自動再試行します）</div>`
    :'';
  if(shiireData.error&&!shiireData.fetchedAt) return head+`<div class="info" style="margin-top:8px;border-color:color-mix(in srgb,var(--crit) 40%,transparent)">⚠ 接続できませんでした — <b>${esc(shiireData.error)}</b><br>15秒後に自動再試行します。原因調査には「仕入表連携」タブの<b>🩺 詳細診断</b>を押してください。<span style="color:var(--muted)">(${APP_VER})</span></div>`;
  const all=shiireData.changes||[];
  const whiteN=all.filter(c=>c.type==='白変更').length;
  const CONDS=['状態','外観','ファインダー','液晶','光学'];
  const list=all.filter(c=>c.type!=='白変更')
    .filter(c=>!(CONDS.includes(c.col)&&String(c.newV).trim()==='なし')); // 「なし」選択は表示しない
  // 警告バナー: 個人ページではその人宛のみ / 仕入表連携タブでは全員分
  const myWarns=list.filter(c=>c.type==='警告'&&(worker?String(c.editor||'').split('・').indexOf(worker)>=0:true));
  let warnHtml=myWarns.map(c=>`<div class="info" style="margin-top:8px;border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:color-mix(in srgb,var(--crit) 8%,var(--surface))">
    🚨 <b>${esc(c.editor)}へ:</b> No.${esc(c.no)} ${c.sku?'/ '+esc(c.sku):''} — ${esc(c.note)}</div>`).join('');
  if(!list.length) return head+errNote+warnHtml+`<div class="empty">今日の変更はまだありません${whiteN?`（白変更 ${whiteN}件は納品用に記録中）`:''}</div>`;
  // 商品ごとに1カード(No.単位でまとめる。SKUは後から入力されても同じカードに)
  const groups={},order=[];
  list.forEach(c=>{const k=c.no||'?';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(c);});
  const shown=full?order:order.slice(0,8);
  // カード内は変更順ではなく列の並び(アルファベット順: B→J〜N→O/P→S…)で表示
  const COL_ORDER={'B列色':1,'行':2,'メーカー':10,'商品名':11,'売値':12,'仕入額':13,'状態':14,'外観':15,
    'ファインダー':16,'液晶':17,'光学':18,'プラス要素':19,'マイナス要素':20,'JAN':21,'ASIN':22,'管理番号(S)':23};
  const ord=c=>c.type==='警告'?0:(COL_ORDER[c.col]??50);
  const dot=h=>`<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${CHG_COLOR[h]||'#ccc'};border:1px solid var(--border);vertical-align:-1px"></span>`;
  const timeLink=(key,arr)=>{const last=arr[arr.length-1];
    return `<a data-tgl="${esc(key)}" style="color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline dotted;font-variant-numeric:tabular-nums;white-space:nowrap">${esc(last.editor)} ${fmtHM(last.t)}${arr.length>1?` (${arr.length}回)`:''}</a>`;};
  const detailBox=(key,arr,isColor,showCol)=>{
    if(!chgOpen.has(key))return '';
    return `<div style="margin:6px 0 3px 6px;padding:8px 11px;background:var(--surface);border:1px dashed var(--border);border-radius:11px;font-size:12.5px;color:var(--ink2)">`+
      arr.map(c=>`<div style="display:flex;gap:9px;align-items:baseline">
        <span style="font-variant-numeric:tabular-nums;flex:0 0 auto">${fmtHM(c.t)}</span>
        <span>${showCol?esc(c.col)+': ':''}${isColor? dot(c.oldV)+' '+esc(c.oldV)+' → '+dot(c.newV)+' '+esc(c.newV)
          : (c.oldV?`「${esc(c.oldV)}」→ `:'')+`「${esc(c.newV)}」`}</span>
        <span style="margin-left:auto;color:var(--muted);flex:0 0 auto">${esc(c.editor)}</span></div>`).join('')+`</div>`;
  };
  const chainOf=arr=>{ // 変更の連鎖(連続する同じ値はまとめる)
    let ch=[]; if(arr[0].oldV)ch.push(arr[0].oldV);
    arr.forEach(c=>ch.push(c.newV));
    return ch.filter((v,i)=>i===0||v!==ch[i-1]);
  };
  const row=(main,right,detail)=>`<div style="padding:5px 0;border-bottom:1px dashed var(--border);font-size:13.5px">
    <div style="display:flex;gap:8px;align-items:baseline">${main}<span style="margin-left:auto;flex:0 0 auto">${right}</span></div>${detail||''}</div>`;

  const body=shown.map(no=>{
    const items=groups[no];
    const sku=(items.find(c=>c.sku)||{}).sku||'';
    const lineArr=[];
    // 警告・行追加・行削除は単独行のまま
    items.filter(c=>c.type==='警告'||c.type==='行追加'||c.type==='行削除').forEach(c=>{
      const col=TYPE_STYLE[c.type]||'var(--muted)';
      const d=c.type==='警告'?esc(c.note):c.type==='行削除'?`No.${esc(c.no)} の行が削除されました`:esc(c.newV);
      lineArr.push({ord:ord(c),html:row(
        `<span class="pill" style="background:${col};flex:0 0 auto">${c.type}</span><span style="min-width:0">${d}</span>`,
        `<span style="color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap">${esc(c.editor)} ${fmtHM(c.t)}</span>`)});
    });
    // 同じ列の複数変更は1行に連結(例: 灰→黄→灰→黄)。時刻クリックで履歴詳細
    const colGroups={};
    items.filter(c=>c.type!=='警告'&&c.type!=='行追加'&&c.type!=='行削除').forEach(c=>{(colGroups[c.col]=colGroups[c.col]||[]).push(c);});
    Object.values(colGroups).forEach(arr=>arr.sort((a,b)=>new Date(a.t)-new Date(b.t)));

    // ◆ 状態(J列): 元の値からの「変更」があった時だけ、元の状態→変更後 を専用行で表示
    if(colGroups['状態']){
      const arr=colGroups['状態'].filter(c=>String(c.oldV).trim()!=='');
      if(arr.length){
        const chain=chainOf(arr);
        const key=no+'|状態';
        lineArr.push({ord:COL_ORDER['状態']??14,html:row(
          `<span class="pill" style="background:var(--satsuei);flex:0 0 auto">状態変更</span>
           <span style="min-width:0">状態: ${chain.map(v=>`「${esc(v)}」`).join(' → ')}</span>`,
          timeLink(key,arr),detailBox(key,arr,false))});
      }
      delete colGroups['状態'];
    }
    // ◆ コンディション(外観・ファインダー・液晶・光学)
    //   初期入力(空欄→値)は1行にまとめて表示 / 既存値の変更は状態と同じく「修正」行で 元→後 を表示
    const COND_COLS=['外観','ファインダー','液晶','光学'];
    const condParts=[],condAll=[];
    COND_COLS.forEach(cn=>{
      if(!colGroups[cn])return;
      const arr=colGroups[cn];
      const inits=arr.filter(c=>String(c.oldV).trim()==='');
      const edits=arr.filter(c=>String(c.oldV).trim()!=='');
      if(inits.length){
        const chain=chainOf(inits);
        condParts.push(chain.length>1
          ? `${esc(cn)}${chain.map(v=>`「${esc(v)}」`).join('→')}`
          : `${esc(cn)}「<b>${esc(chain[0]||'')}</b>」`);
        condAll.push(...inits);
      }
      if(edits.length){
        const chain=chainOf(edits);
        const key=no+'|'+cn+'_fix';
        lineArr.push({ord:(COL_ORDER['状態']??14)+0.1,html:row(
          `<span class="pill" style="background:var(--satsuei);flex:0 0 auto">修正</span>
           <span style="min-width:0">${esc(cn)}: ${chain.map(v=>`「${esc(v)}」`).join(' → ')}</span>`,
          timeLink(key,edits),detailBox(key,edits,false))});
      }
      delete colGroups[cn];
    });
    if(condParts.length){
      condAll.sort((a,b)=>new Date(a.t)-new Date(b.t));
      const key=no+'|コンディション';
      lineArr.push({ord:COL_ORDER['外観']??15,html:row(
        `<span class="pill" style="background:${TYPE_STYLE['変更']};flex:0 0 auto">変更</span>
         <span style="min-width:0">コンディション: ${condParts.join(' ・ ')}</span>`,
        timeLink(key,condAll),detailBox(key,condAll,false,true))});
    }
    // ◆ それ以外の列は従来どおり列ごとに1行
    Object.entries(colGroups).forEach(([colName,arr])=>{
      const isColor=colName==='B列色';
      const key=no+'|'+colName;
      const chain=isColor?[arr[0].oldV,...arr.map(c=>c.newV)].filter((v,i,a)=>i===0||v!==a[i-1]):chainOf(arr);
      const last=arr[arr.length-1];
      let main;
      if(isColor){
        main=`<span class="pill" style="background:${TYPE_STYLE['色変更']};flex:0 0 auto">色変更</span>
          <span style="min-width:0">${chain.map(h=>dot(h)+' '+esc(h)).join(' → ')}</span>`;
      }else{
        const pc=TYPE_STYLE[last.type]||'var(--nouhin)';
        const label=chain.length>1
          ? chain.map(v=>`「${esc(v)}」`).join(' → ')
          : `変更後「<b>${esc(chain[0]||'')}</b>」`;
        main=`<span class="pill" style="background:${pc};flex:0 0 auto">${last.type}</span>
          <span style="min-width:0">${esc(colName)}: ${label}</span>`;
      }
      lineArr.push({ord:COL_ORDER[colName]??50,html:row(main,timeLink(key,arr),detailBox(key,arr,isColor))});
    });
    lineArr.sort((a,b)=>a.ord-b.ord);
    return `<div style="margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:15px;padding:11px 14px">
      <div style="font-weight:900;font-size:14px">📦 No.${esc(no)}${sku?` <span style="color:var(--muted);font-weight:600;font-size:12px">SKU: ${esc(sku)}</span>`:''}</div>${lineArr.map(l=>l.html).join('')}</div>`;
  }).join('');
  const more=!full&&order.length>shown.length?`<div class="thint" style="margin-top:8px;text-align:center">ほか ${order.length-shown.length} 商品の変更あり — 「仕入表連携」タブで全件表示</div>`:'';
  const whiteNote=whiteN?`<div class="thint" style="margin-top:8px">🤍 白への色変更 ${whiteN}件は納品管理用に記録中（変更点には表示しません）</div>`:'';
  return head+errNote+warnHtml+body+more+whiteNote;
}

/* ============================================================
   退社時刻の押し忘れ自動停止
   全員16時退社: 開始日の16:30を過ぎても計測中のタイマーは
   16:00終了として自動保存し、備考に押し忘れの旨を記載
   ============================================================ */
const AUTO_END_H=16, AUTO_END_M=0, GRACE_H=16, GRACE_M=30;
function autoStopCheck(){
  if(!state.active.length) return;
  const now=new Date(); let n=0;
  state.active.slice().forEach(a=>{
    const s=new Date(a.start);
    const endT=new Date(s); endT.setHours(AUTO_END_H,AUTO_END_M,0,0);
    let grace=new Date(s); grace.setHours(GRACE_H,GRACE_M,0,0);
    if(s>=endT) grace=new Date(s.getTime()+2*3600000); // 16時以降に開始した場合は開始2時間後を猶予に
    if(now<=grace) return;
    const end = s<endT ? endT : s; // 16時以降開始なら開始時刻で終了(0:00)
    const t=ALL_TASKS[a.cat];
    addRec({id:uid(),cat:a.cat,workers:a.workers.slice(),start:a.start,end:end.toISOString(),
      sec:durSec(a.start,end.toISOString()),
      count:t.fields.includes('count')?0:null,product:null,packNo:null,sub:null,
      retake:false,recheck:false,
      note:'⚠ 停止押し忘れのため16:00で自動終了・保存'});
    state.active=state.active.filter(x=>x.id!==a.id);
    n++;
  });
  if(n){saveState();render();toast(`⚠ 停止押し忘れ ${n}件を16:00で自動終了・保存しました（備考に記載済み）`);}
}
setInterval(autoStopCheck,30000);

/* ---------- theme / clock ---------- */
document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);
  document.getElementById('themeBtn').textContent=nx==='dark'?'☀️':'🌙';render();};
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(tick,1000);tick();

autoStopCheck(); // 起動時にも押し忘れをチェック(前日分など)
render();
if(scfg.url){flushQ();pullRecords();} // 起動時に記録を同期
</script>
